function endX(w){B.over=1;clearInterval(B.iv);const s=B.i,tw=s.mode=='tower';let r='',again;if(tw){if(w){const f=s.f,g=200+60*f,cr=1+(f%5?0:2),ore=2+f%4;S.gold+=g;S.mat.ore+=ore;S.mat.cry+=cr;S.exp+=2;let x='';if(f%5==0){S.gems+=60;x=' · 💎60 · การ์ดใหม่ 1 ใบ';S.cards.push({id:S.cid++,t:Object.keys(CARDS)[Math.random()*4|0],l:1})}const ids=Object.keys(S.own);S.own[ids[Math.random()*ids.length|0]].sh+=3;S.tower=Math.max(S.tower,f);S.jew+=500+150*f;alert('ได้รับอัญมณี 💠 '+(500+150*f));r=`<p>🪙${g} · แร่อีเธอร์ ×${ore} · คริสตัลรอยแยก ×${cr}${x} · เศษตัวละคร ×3</p>`}again='startTower()'}else{const c=w?B.waves:B.wave-1,g=150*c;S.gold+=g;S.mat.herb+=c+1;S.jew+=800*c;if(c)alert('ได้รับอัญมณี 💠 '+800*c);S.mat.ore+=c;if(w){S.dlv++;S.gems+=80;S.exp+=3;S.mat.cry+=2}r=`<p>ผ่าน ${c}/${B.waves} คลื่น · 🪙${g} · สมุนไพร ×${c+1} · แร่อีเธอร์ ×${c}${w?' · 💎80 · คริสตัล ×2':''}</p>`;again='startDef()'}

function acctScene(){const sc=V.sc,cam=V.cam;sc.background=new THREE.Color(0x070b18);sc.fog=new THREE.Fog(0x070b18,6,18);sc.add(new THREE.AmbientLight(0x6688aa,.7));const pl=new THREE.PointLight(0x38bdf8,2,14);pl.position.set(0,2,2);sc.add(pl);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.4,.4,8),new THREE.MeshStandardMaterial({color:0x2a2f4a,metalness:.5,roughness:.5}));base.position.y=-.9;sc.add(base);
 const cr=new THREE.Mesh(new THREE.OctahedronGeometry(.6),new THREE.MeshStandardMaterial({color:0x38bdf8,emissive:0x1a8cc0,emissiveIntensity:1,metalness:.3,roughness:.2}));cr.scale.y=1.5;cr.position.y=.5;sc.add(cr);
 const r1=new THREE.Mesh(new THREE.TorusGeometry(1.2,.03,6,48),new THREE.MeshBasicMaterial({color:0xd4af37})),r2=new THREE.Mesh(new THREE.TorusGeometry(1.6,.025,6,48),new THREE.MeshBasicMaterial({color:0x38bdf8}));r1.position.y=r2.position.y=.5;sc.add(r1);sc.add(r2);
 const n=90,pos=new Float32Array(n*3),spd=[];for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*5;pos[i*3+1]=Math.random()*5-1;pos[i*3+2]=(Math.random()-.5)*3;spd.push(.2+Math.random()*.4)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));sc.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x7ad8ff,size:.06,transparent:true,opacity:.8})));cam.position.set(0,1.4,6);cam.lookAt(0,.6,0);V.ac={cr,r1,r2,g,pos,spd,n}}
function acctAnim(dt){const a=V.ac;a.cr.rotation.y+=dt*.8;a.cr.position.y=.5+Math.sin(V.t*1.5)*.15;a.r1.rotation.x=V.t*.6;a.r1.rotation.y=V.t*.3;a.r2.rotation.x=1.2+V.t*.2;a.r2.rotation.z=V.t*.5;for(let i=0;i<a.n;i++){a.pos[i*3+1]+=a.spd[i]*dt;if(a.pos[i*3+1]>4)a.pos[i*3+1]=-1}a.g.attributes.position.needsUpdate=true}

function acctRender(){const c=$('acd');if(!c)return;const u0=($('au')||{}).value||'',reg=atab=='reg',lo=!!ACC;
 c.innerHTML=`<div style="text-align:center"><div style="font-size:34px">🛡️</div><h2 style="margin:4px 0;color:#d4af37">พันธสัญญาผู้บัญชาการ</h2><small class="mu">ลงนามเพื่อบันทึกชะตากรรมและกองกำลังของคุณ</small></div>${lo?`<p style="text-align:center;margin:8px 0">บัญชีปัจจุบัน: <b style="color:#38bdf8">${ACN}</b> <button onclick="acctLogout()">ออกจากระบบ</button></p>`:''}

 <label class="mu">ชื่อผู้บัญชาการ</label><div class="fld2">👤<input id="au" type="text" maxlength="20" autocomplete="username" placeholder="ชื่อผู้บัญชาการ" value="${u0.replace(/"/g,'')}" onkeydown="if(event.key=='Enter')acctSubmit()"></div>
 <label class="mu">รหัสผ่าน</label><div class="fld2">🔒<input id="ap" type="${apw?'text':'password'}" maxlength="40" autocomplete="${reg?'new-password':'current-password'}" placeholder="รหัสผ่าน" onkeydown="if(event.key=='Enter')acctSubmit()"><button onclick="apw=!apw;const v=$('ap').value;acctRender();$('ap').value=v" title="แสดง/ซ่อนรหัสผ่าน">${apw?'🙈 ซ่อน':'👁 แสดง'}</button></div>
 ${reg?`<label class="mu">ยืนยันรหัสผ่าน</label><div class="fld2">🔒<input id="ap2" type="${apw?'text':'password'}" maxlength="40" autocomplete="new-password" placeholder="ยืนยันรหัสผ่าน" onkeydown="if(event.key=='Enter')acctSubmit()"></div>`:''}
 <label style="display:block;margin:4px 0"><input id="ar" type="checkbox" checked> จดจำบัญชีนี้ไว้ในเครื่อง</label>${reg&&!ACC?'<label style="display:block;margin:4px 0"><input id="aa" type="checkbox" checked> นำความคืบหน้าปัจจุบันของผู้เยี่ยมชมเข้าบัญชีนี้</label>':''}
 <div id="am2" style="min-height:24px;margin:6px 0">${hasSubtle()?'':'<span class="mu">หมายเหตุ: เบราว์เซอร์นี้ไม่รองรับการเข้ารหัสแบบเต็ม ใช้การแฮชแบบสำรอง</span>'}</div>
 <button class="gold" onclick="acctSubmit()">${reg?'จารึกพันธสัญญา':'เข้าสู่สนามรบ'}</button>

function acctSubmit(){if(atab=='reg')doReg();else doLogin()}
function enterAcc(n,rem){save();loadAcc(n);const a=accs();a.last=rem?n:null;accsSave(a);try{if(!rem)sessionStorage.setItem('aef_sess',n);else sessionStorage.removeItem('aef_sess')}catch(e){}save();acctClose();alert('ยินดีต้อนรับ ผู้บัญชาการ '+ACN);go('hub')}
async function doLogin(){const u=$('au').value.trim(),p=$('ap').value,n=u.toLowerCase();if(!u||!p)return afb('กรุณากรอกชื่อและรหัสผ่านให้ครบ');const us=accs().users[n];if(!us)return afb('ไม่พบบัญชีนี้ ลองสร้างบัญชีใหม่');const h=await hashPw(p,us.salt,us.alg);if(h!==us.hash)return afb('รหัสผ่านไม่ถูกต้อง');enterAcc(n,$('ar').checked)}
async function doReg(){const u=$('au').value.trim(),p=$('ap').value,p2=$('ap2').value,n=u.toLowerCase();if(!u||!p||!p2)return afb('กรุณากรอกข้อมูลให้ครบทุกช่อง');if(u.length<3)return afb('ชื่อต้องยาวอย่างน้อย 3 ตัวอักษร');if(!/^[A-Za-z0-9_\u0E00-\u0E7F]+$/.test(u))return afb('ชื่อใช้ได้เฉพาะตัวอักษร ตัวเลข และ _ เท่านั้น');if(p.length<4)return afb('รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร');if(p!==p2)return afb('รหัสผ่านและการยืนยันไม่ตรงกัน');const a=accs();if(a.users[n])return afb('ชื่อนี้ถูกใช้แล้ว กรุณาเลือกชื่ออื่น');const salt=Math.random().toString(36).slice(2)+Date.now().toString(36),alg=hasSubtle()?'s':'c';a.users[n]={name:u,salt,alg,hash:await hashPw(p,salt,alg),created:Date.now()};accsSave(a);const adopt=$('aa')&&$('aa').checked;if(adopt&&!ACC&&!S.admin){try{localStorage.setItem(SP+n,JSON.stringify(S))}catch(e){}}enterAcc(n,$('ar').checked)}
function acctGuest(){if(ACC)acctLogout();else{acctClose();go('hub')}}
function acctLogout(){save();const a=accs();a.last=null;accsSave(a);try{sessionStorage.removeItem('aef_sess')}catch(e){}loadGuest();acctClose();alert('ออกจากระบบแล้ว (โหมดผู้เยี่ยมชม)');go('hub')}

function b64e(t){return btoa(unescape(encodeURIComponent(t)))}function b64d(t){return decodeURIComponent(escape(atob(t)))}
function exportSave(){if(S.admin)return alert('กรุณาออกจากโหมดทดสอบก่อนส่งออกเซฟ');save();const j=JSON.stringify({app:'AEF',v:VER,t:Date.now(),acct:ACN,data:S}),code='AEF1.'+b64e(j)+'.'+cyrb(j);modal(`<h3>📤 ส่งออกเซฟ</h3><p class="mu">คัดลอกรหัสนี้เก็บไว้ (บัญชี: ${ACN||'ผู้เยี่ยมชม'}) ใช้กู้คืนได้ที่ "นำเข้าเซฟ"</p><textarea id="ec" readonly style="width:100%;height:120px;font-size:12px;background:#0a1024;color:#e8e8f4;border:1px solid #2c3256;border-radius:8px">${code}</textarea><div class="row" style="justify-content:center;margin-top:8px"><button class="pri" onclick="copyExp()">📋 คัดลอก</button><button onclick="mclose()">ปิด</button></div><small class="mu">รหัสนี้ไม่ได้เข้ารหัส อย่าแชร์ให้คนอื่น</small>`)}
function copyExp(){const t=$('ec');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>alert('คัดลอกแล้ว ✅'),()=>alert(ok?'คัดลอกแล้ว ✅':'คัดลอกอัตโนมัติไม่ได้ กรุณากด Ctrl+C / แตะค้างเพื่อคัดลอก'));else alert(ok?'คัดลอกแล้ว ✅':'คัดลอกอัตโนมัติไม่ได้ กรุณากด Ctrl+C / แตะค้างเพื่อคัดลอก')}
function importMenu(){modal(`<h3>📥 นำเข้าเซฟ</h3><p class="mu">วางรหัสเซฟที่เคยส่งออกไว้ ข้อมูลของ ${ACN?'บัญชี '+ACN:'ผู้เยี่ยมชม'} ปัจจุบันจะถูกแทนที่</p><textarea id="ic" placeholder="วางรหัสเซฟ (ขึ้นต้นด้วย AEF1.)" style="width:100%;height:110px;font-size:13px;background:#0a1024;color:#e8e8f4;border:1px solid #2c3256;border-radius:8px"></textarea><div id="im" style="min-height:22px"></div><div class="row" style="justify-content:center"><button class="pri" onclick="importCheck()">ตรวจสอบรหัส</button><button onclick="mclose()">ยกเลิก</button></div>`)}

function importCheck(){const t=($('ic').value||'').trim(),m=$('im'),bad=x=>{m.innerHTML='<span style="color:#ff8a8a">⚠️ '+x+'</span>'};const p=t.split('.');if(p.length!==3||p[0]!=='AEF1')return bad('รหัสไม่ถูกต้อง (ต้องขึ้นต้นด้วย AEF1.)');let j,o;try{j=b64d(p[1])}catch(e){return bad('อ่านรหัสไม่ได้ อาจคัดลอกมาไม่ครบ')}if(cyrb(j)!==p[2])return bad('รหัสถูกแก้ไขหรือเสียหาย (ตรวจผลรวมไม่ผ่าน)');try{o=JSON.parse(j)}catch(e){return bad('ข้อมูลในรหัสเสียหาย')}if(!o||o.app!=='AEF'||!o.data||typeof o.data.own!=='object')return bad('ไม่ใช่เซฟของเกมนี้');IMP=migrate(o.data);IMP.admin=0;const n=Object.keys(IMP.own).length,dn=Object.keys(IMP.cd||{}).length;modal(`<h3>ยืนยันการนำเข้า</h3><p>จากบัญชี: <b>${o.acct||'ผู้เยี่ยมชม'}</b><br>ตัวละคร ${n} ตัว · ด่านที่ผ่าน ${dn} · เหรียญ ${IMP.gold}<br><small class="mu">บันทึกเมื่อ ${new Date(o.t).toLocaleString('th-TH')}</small></p><p style="color:#ffb84a">ข้อมูลปัจจุบันของ ${ACN?'บัญชี '+ACN:'ผู้เยี่ยมชม'} จะถูกแทนที่</p><div class="row" style="justify-content:center"><button class="pri" onclick="importDo()">ยืนยันนำเข้า</button><button onclick="mclose()">ยกเลิก</button></div>`)}
